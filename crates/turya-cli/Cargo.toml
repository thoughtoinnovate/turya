[package]
name = "turya-cli"
version = "0.1.3"
edition = "2021"

[[bin]]
name = "turya"
path = "src/main.rs"

[dependencies]
turya-protocol = { path = "../turya-protocol" }
turya-tools = { path = "../turya-tools" }
turya-core = { path = "../turya-core" }
turya-server = { path = "../turya-server" }
turya-tui = { path = "../turya-tui" }
turya-memory = { path = "../turya-memory" }
turya-lsp = { path = "../turya-lsp" }
turya-auth = { path = "../turya-auth" }
turya-catalog = { path = "../turya-catalog" }
turya-mcp = { path = "../turya-mcp" }
turya-skills = { path = "../turya-skills" }
turya-provider-anthropic = { path = "../turya-provider-anthropic" }
turya-provider-gemini = { path = "../turya-provider-gemini" }
tokio = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
# Durable settings file. Hand-rolled use of a tiny, stable parser; no
# backward-compat layer is written for other versions (Rule 5.4).
toml = "0.8"
reqwest = { workspace = true }
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
rpassword = "7"
